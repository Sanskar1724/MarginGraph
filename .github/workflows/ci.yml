# Free GitHub Actions CI. Every job runs on ubuntu-latest with no secrets and no
# dataset: tests use the synthetic fixture in tests/conftest.py. New test files
# under tests/ are picked up automatically.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.2   # same version as .pre-commit-config.yaml
      - run: ruff check --output-format=github .

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    services:
      postgres:   # tests/test_service.py also runs against Postgres
        image: postgres:16-alpine
        env: {POSTGRES_USER: mg, POSTGRES_PASSWORD: mg, POSTGRES_DB: mgtest}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mg -d mgtest" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,service]"
      - run: pytest -q -m "not slow" --durations=10
      - name: service tests on Postgres
        run: pytest -q tests/test_service.py
        env:
          MARGINGRAPH_TEST_DATABASE_URL: postgresql+psycopg://mg:mg@localhost:5432/mgtest

  quality-gate:
    name: model quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: committed results (real Online Retail II run) must beat popularity
        run: margingraph-gate results --strict
      - name: fresh run on the fixture must beat popularity
        run: |
          python scripts/fixture_bundle.py "$RUNNER_TEMP/fx"
          margingraph-gate "$RUNNER_TEMP/fx/results"

  docker:
    name: docker build + API load smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the image, so the pickled bundle loads
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: docker build -t margingraph:ci .
      - run: pip install -e ".[dev]"
      - name: fixture model bundle
        run: python scripts/fixture_bundle.py "$RUNNER_TEMP/fx"
      - name: production API smoke test (default command)
        run: |
          docker run -d --name svc -p 8100:8000 -e MARGINGRAPH_ENV=production -e MARGINGRAPH_ADMIN_KEY=ci margingraph:ci
          for i in $(seq 1 60); do curl -fs localhost:8100/health && break; sleep 1; done
          curl -fs localhost:8100/ready
          KEY=$(curl -fs -X POST localhost:8100/v1/admin/stores -H 'X-Admin-Key: ci' -H 'Content-Type: application/json' \
            -d '{"store_id": "ci"}' | python -c "import json,sys; print(json.load(sys.stdin)['api_key'])")
          curl -fs -X POST localhost:8100/v1/catalog -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"products": [{"item": "A1", "price": 10, "unit_cost": 5, "stock": 3}]}'
          curl -fs -X POST localhost:8100/v1/recommend -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"basket": ["Z9"]}' | grep -q '"A1"'
          docker logs svc; docker rm -f svc
      - name: start the research demo API from the same image
        run: |
          docker run -d --name mg -p 8000:8000 -e MARGINGRAPH_ARTIFACTS=/app/artifacts \
            -v "$RUNNER_TEMP/fx/artifacts:/app/artifacts:ro" margingraph:ci \
            uvicorn margingraph.api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/recommend -H 'Content-Type: application/json' \
            -d '{"basket": ["10003", "10005"]}'
      - name: load test (fixture model, loose budget for shared runners)
        run: |
          python scripts/loadtest.py --artifacts "$RUNNER_TEMP/fx/artifacts" -n 300 -c 4 \
            --max-p95-ms 2000 --out loadtest-ci.json
      - if: always()
        run: docker logs mg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-ci
          path: loadtest-ci.json
          if-no-files-found: ignore
