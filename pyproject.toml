[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margingraph"
version = "0.1.0"
description = "Basket add-on recommender: relevance ranking + margin-aware MILP"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "scipy",
  "pyarrow",
  "duckdb",
  "openpyxl",
  "pyyaml",
  "scikit-learn",
  "implicit>=0.7",
  "lightgbm>=4.0",
  "pulp>=2.7",
  "highspy",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
margingraph = "margingraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
