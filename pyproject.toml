[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margingraph"
version = "0.1.0"
description = "Basket add-on recommender: relevance ranking + margin-aware MILP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sanskar1724" }]
keywords = ["recommender-systems", "e-commerce", "lightgbm", "mixed-integer-programming", "pulp", "learning-to-rank"]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "scipy",
  "pyarrow",
  "duckdb",
  "openpyxl",
  "pyyaml",
  "scikit-learn",
  "implicit>=0.7",
  "lightgbm>=4.0",
  "pulp>=2.7",
  "highspy",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
item2vec = ["gensim"]  # optional source, off by default (lost on val)

[project.urls]
Repository = "https://github.com/Sanskar1724/MarginGraph"
Paper = "https://github.com/Sanskar1724/MarginGraph/blob/main/paper/main.pdf"

[project.scripts]
margingraph = "margingraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
