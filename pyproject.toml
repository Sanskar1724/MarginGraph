[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "margingraph"
version = "0.1.0"
description = "Basket add-on recommender: relevance ranking + margin-aware MILP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sanskar1724" }]
keywords = ["recommender-systems", "e-commerce", "lightgbm", "mixed-integer-programming", "pulp", "learning-to-rank"]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy",
  "scipy",
  "pyarrow",
  "duckdb",
  "openpyxl",
  "pyyaml",
  "scikit-learn",
  "implicit>=0.7",
  "lightgbm>=4.0",
  "pulp>=2.7",
  "highspy",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "pre-commit"]

[project.urls]
Repository = "https://github.com/Sanskar1724/MarginGraph"
Paper = "https://github.com/Sanskar1724/MarginGraph/blob/main/paper/main.pdf"

[project.scripts]
margingraph = "margingraph.cli:main"
margingraph-gate = "margingraph.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors + import order + bugbear. Line length is left
# to review: the research code keeps long formulas on one line on purpose.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/margingraph/cli.py" = ["E402"]  # env var must be set before numeric imports
"tests/*" = ["E402"]
"paper/*" = ["B905"]  # figure script zips fixed-length style lists

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full dataset or a GPU; skipped in CI"]
