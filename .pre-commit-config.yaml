# Install once:  pip install pre-commit && pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks            # API keys, tokens, passwords (HF, Kaggle, GitHub, AWS, ...)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # keep datasets and model files out of git
        exclude: ^space/artifacts/   # the small demo model the HF Space loads
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: notebook-outputs    # notebook outputs are where a token leaked before
        name: notebooks have no cell outputs
        entry: python scripts/check_notebooks.py
        language: python
        files: \.ipynb$
        exclude: ^notebooks/exploration/   # archived runs; outputs kept as the record (scanned: no secrets)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
