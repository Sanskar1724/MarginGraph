<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>MarginGraph architecture: retrieval, rerank, calibrate, optimize</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#0f172a">How MarginGraph picks checkout add-ons</text>
  <text x="32" y="62" font-size="13" fill="#64748b">Stage 1 decides what the customer wants. Stage 2 decides what the store can afford to show.</text>

  <g font-size="13">
    <rect x="32" y="96" width="150" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="107" y="124" text-anchor="middle" font-weight="700" fill="#0f172a">Cart + history</text>
    <text x="107" y="150" text-anchor="middle" fill="#475569">invoices, items,</text>
    <text x="107" y="168" text-anchor="middle" fill="#475569">prices, cost, stock</text>
    <text x="107" y="190" text-anchor="middle" fill="#94a3b8" font-size="11">CSV · Shopify · Woo</text>

    <rect x="222" y="96" width="170" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="307" y="124" text-anchor="middle" font-weight="700" fill="#1e3a8a">1a · Retrieval</text>
    <text x="307" y="150" text-anchor="middle" fill="#1e40af">EASE · ItemKNN · ALS</text>
    <text x="307" y="168" text-anchor="middle" fill="#1e40af">co-purchase · repeat</text>
    <text x="307" y="190" text-anchor="middle" fill="#3b82f6" font-size="11">100 candidates · recall 58%</text>

    <rect x="432" y="96" width="170" height="110" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="517" y="124" text-anchor="middle" font-weight="700" fill="#1e3a8a">1b · Rerank</text>
    <text x="517" y="150" text-anchor="middle" fill="#1e40af">LightGBM ranker</text>
    <text x="517" y="168" text-anchor="middle" fill="#1e40af">+ isotonic p(buy)</text>
    <text x="517" y="190" text-anchor="middle" fill="#3b82f6" font-size="11">Hit@10 35.6% vs 31.1%</text>

    <rect x="642" y="96" width="170" height="110" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="727" y="124" text-anchor="middle" font-weight="700" fill="#064e3b">2 · Optimize</text>
    <text x="727" y="150" text-anchor="middle" fill="#065f46">PuLP / HiGHS MILP</text>
    <text x="727" y="168" text-anchor="middle" fill="#065f46">max expected profit</text>
    <text x="727" y="190" text-anchor="middle" fill="#10b981" font-size="11">+17% profit · 0 floor breaks</text>

    <rect x="852" y="96" width="80" height="110" rx="10" fill="#0f172a"/>
    <text x="892" y="140" text-anchor="middle" font-weight="700" fill="#ffffff">≤ 2</text>
    <text x="892" y="160" text-anchor="middle" fill="#cbd5e1" font-size="12">add-ons</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <line x1="184" y1="151" x2="218" y2="151"/>
    <line x1="394" y1="151" x2="428" y2="151"/>
    <line x1="604" y1="151" x2="638" y2="151"/>
    <line x1="814" y1="151" x2="848" y2="151"/>
  </g>
  <rect x="642" y="226" width="290" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="246" font-size="12" fill="#334155">Hard rules: margin ≥ 15% · ≤ 2 items · in stock</text>
  <text x="656" y="264" font-size="12" fill="#334155">Overstock weight 1.0–2.0× · discount limits</text>
  <rect x="222" y="226" width="380" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="236" y="246" font-size="12" fill="#334155">LLM rerank (Qwen2.5 1.5B / 3B) tested: NO-GO so far.</text>
  <text x="236" y="264" font-size="12" fill="#334155">The LLM never sets prices or overrides constraints.</text>
</svg>
